name: iOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show selected toolchain
        run: xcodebuild -version && swift --version
      - name: Test Foundation core and iOS integration
        run: bash scripts/check-macos.sh
      - name: Build unsigned device package
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsTracker-unsigned-ipa
          path: build/artifacts/AirPodsTracker-unsigned.ipa
